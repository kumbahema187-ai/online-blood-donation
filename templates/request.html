{% extends 'layout.html' %}
{% block content %}
<div class="card card-custom p-4">
  <h4>Request Blood</h4>
  <form method="POST" class="row g-3 mt-2">
    <div class="col-md-6"><label class="form-label">Patient Name</label><input name="patient_name" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Blood Group</label><input name="blood_group" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Hospital / Location</label><input name="hospital" class="form-control"></div>
    <div class="col-12"><label class="form-label">Reason / Details</label><textarea name="reason" class="form-control" rows="3"></textarea></div>
    <div class="col-12"><button class="btn btn-danger-custom">Submit Request</button> <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a></div>
  </form>
</div>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
  <title>Simple Login Validation</title>
</head>
<body>
  <h2>Login Form</h2>

  <input type="text" id="username" placeholder="Username" required><br><br>

  <input type="password" id="password" placeholder="Password"
    pattern="^[A-Za-z][A-Za-z0-9][A-Za-z0-9!@#$%^&*]{6,}$"
    title="Password must contain at least 6 characters, one uppercase letter, one number, and one special character"
    required><br><br>

  <button onclick="validate()">Login</button>

  <p id="output"></p>

  <script>
    function validate() {
      let user = document.getElementById("username").value;
      let pass = document.getElementById("password");

      if (!user || !pass.value) {
        document.getElementById("output").style.color = "red";
        document.getElementById("output").innerText = "Enter both username and password.";
        return;
      }

      if (!pass.checkValidity()) {
        document.getElementById("output").style.color = "red";
        document.getElementById("output").innerText = pass.validationMessage;
        return;
      }

      document.getElementById("output").style.color = "green";
      document.getElementById("output").innerText = "Login successful!";
    }
  </script>

</body>
</html>
